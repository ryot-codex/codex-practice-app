<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ディズニー待ち時間メモ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div>
          <p class="eyebrow">Disney Wait Notes</p>
          <h1>ディズニー待ち時間メモ</h1>
          <p class="lead">東京ディズニーランド / シー の待ち時間を見やすく確認</p>
        </div>
      </header>

      <section class="filter-bar" aria-label="フィルターと並び替え">
        <div class="control-group" role="group" aria-label="パーク切り替え">
          <p class="group-label">パーク</p>
          <div class="segmented-control">
            <button type="button" data-park-filter="ランド" class="seg-button">ランド</button>
            <button type="button" data-park-filter="シー" class="seg-button">シー</button>
            <button type="button" data-park-filter="すべて" class="seg-button is-active">すべて</button>
          </div>
        </div>

        <div class="control-group" role="group" aria-label="並び順切り替え">
          <p class="group-label">並び順</p>
          <div class="segmented-control">
            <button type="button" data-sort="recommended" class="seg-button is-active">おすすめ順</button>
            <button type="button" data-sort="wait" class="seg-button">待ち時間順</button>
          </div>
        </div>

        <div class="status-row" aria-live="polite">
          <p id="currentState" class="current-state"></p>
          <p id="countText" class="count-text"></p>
          <p id="lastUpdated" class="count-text"></p>
          <p id="dataNotice" class="notice-inline"></p>
          <p id="loadingState" class="loading-inline" aria-live="polite"></p>
        </div>
      </section>

      <section class="notice" aria-label="注意事項">
        <p>※ これは東京ディズニーリゾート公式アプリではありません。</p>
        <p>※ <a href="https://queue-times.com/" target="_blank" rel="noopener noreferrer">Powered by Queue-Times.com</a></p>
      </section>

      <section class="recommend" aria-live="polite">
        <div class="recommend-head">
          <h2>今おすすめ</h2>
          <span class="recommend-tag">Pick</span>
        </div>
        <p id="recommendText"></p>
      </section>

      <section class="list-section">
        <h2>アトラクション一覧</h2>
        <div id="attractionList" class="card-list"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
